spring.application.name=JobPortal
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jobportal_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}
logging.level.org.springframework.security=INFO
gemini.api.key=${GEMINI_API_KEY}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
resume.upload.dir=${RESUME_UPLOAD_DIR:uploads/resumes}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB